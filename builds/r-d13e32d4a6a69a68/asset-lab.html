<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>制圧 | キャラクター試作</title>
<style>*{box-sizing:border-box}body{margin:0;background:#111719;color:#e8ebe7;font-family:system-ui,'Yu Gothic',sans-serif}canvas{display:block;width:100%;height:100dvh;touch-action:none}header{position:absolute;top:0;left:0;right:0;display:flex;justify-content:space-between;align-items:flex-start;padding:24px 30px;pointer-events:none;background:linear-gradient(#111719dc,transparent)}header a{pointer-events:auto}h1{margin:3px 0;font-size:26px;font-weight:600;letter-spacing:.12em}.eyebrow{font-size:10px;color:#a8b7ad;letter-spacing:.22em}a{color:#e4c995;text-decoration:none;border-bottom:1px solid #746850;padding:8px 0}p{font-size:12px;line-height:1.7;color:#b4bcb8;margin:8px 0}.panel{position:absolute;bottom:24px;left:50%;transform:translateX(-50%);width:min(680px,94vw);padding:18px 22px;background:#172024ed;border:1px solid #3d4a4d;border-radius:8px;backdrop-filter:blur(14px)}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;justify-content:space-between}button,select{font:inherit;font-size:13px;color:#dce4df;background:#283539;border:1px solid #4c5a5e;padding:10px 15px;border-radius:4px;cursor:pointer}button.active{background:#bda26e;border-color:#cbb786;color:#18201e}button:disabled{opacity:.45;cursor:wait}#status{color:#cfb785;font-size:12px;min-height:18px}#metrics{font-variant-numeric:tabular-nums;font-size:11px;color:#899a94;margin-left:auto}label{font-size:12px;color:#bfcac5}#fatal{position:absolute;top:42%;left:50%;transform:translate(-50%,-50%);max-width:440px;line-height:1.9;color:#ead1a5}details{font-size:12px;margin-top:12px;color:#8f9f98}summary{cursor:pointer}details p{font-size:11px}@media(max-width:600px){header{padding:18px}h1{font-size:20px}.panel{bottom:10px;padding:14px}button{padding:9px 11px}header p{max-width:220px}}</style></head>
<body><canvas id="preview"></canvas><header><div><span class="eyebrow">SEIATSU / CHARACTER STUDY 01</span><h1>キャラクター試作</h1><p>購入したBanditをブラウザーで表示。<br>ドラッグで回転、ホイール・ピンチで拡大。</p></div><a href="index.html">ゲームへ戻る →</a></header>
<div id="fatal" role="alert"></div><section class="panel"><div class="row"><span class="eyebrow">MILITARY MERCENARY BANDIT</span><span id="metrics"></span></div><p id="status" role="status">キャラクターを読み込んでいます…</p><div class="row"><div><button data-clip="ThirdPersonIdle" disabled>待機</button> <button data-clip="ThirdPersonWalk" disabled>歩き</button> <button data-clip="ThirdPersonRun" disabled>走り</button></div><div><button id="pause" disabled>一時停止</button> <button id="rotate">自動回転</button></div></div><div class="row" style="margin-top:12px"><label>照明 <select id="light"><option value="day">昼光</option><option value="warm">夕方</option><option value="night">夜の照明</option></select></label><label>画質 <select id="quality"><option value="standard">標準</option><option value="low">軽量</option></select></label><button id="reset-view">視点を戻す</button></div><details><summary>今回確認できること</summary><p>素材に含まれる待機・歩き・走りのデモ動作と、肌・服の見え方を確認できます。戦闘中の構え、匍匐、負傷、倒れ方への組込みは次の段階です。FPS Animation Pack Liteの腕と武器は、この表示にはまだ使っていません。</p></details></section>
<script src="js/three.min.js"></script><script src="js/lib/GLTFLoader.js"></script><script src="js/lib/OrbitControls.js"></script><script src="js/lib/RoomEnvironment.js"></script><script src="js/asset-lab.js"></script></body></html>
